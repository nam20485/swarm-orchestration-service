# Phase 0.0 skeleton: webhook listener + Caddy proxy.
#
# Ported from orchestrator-service @2bd6d06 with the always-on
# `orchestratorservice` (opencode serve) container deliberately dropped — the
# ACP host (Phase 2) replaces it and must never exist as a container here
# (docs/plans/completed/orchestrator-service-simplification.md §3/§7).
#
# Setup: cp .env.example .env next to this file (gitignored) and fill in at
# least:
#   OS_WEBHOOK_SECRET=<the GitHub App webhook secret>
# Optional: WEBHOOK_SITE_ADDRESS (default :80) plus the listener knobs
# forwarded below (WEBHOOK_LOG_LEVEL, WEBHOOK_MAX_BODY_BYTES,
# WEBHOOK_EVENTS_KEEPALIVE, and DIRECT_BODY_ALLOWED_SENDERS — see
# .env.example. ACP_* and SANDBOX_* are host-run-only: the compose image
# has no opencode and no docker, so agent sessions cannot run there
# (ACP_ENABLED is pinned false below).
services:
  webhook-receiver:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    image: swarm-orchestration-service/webhook:local
    expose:
      - "8080"
    environment:
      - OS_WEBHOOK_SECRET=${OS_WEBHOOK_SECRET:?OS_WEBHOOK_SECRET is required}
      # Pinned false — the image has no opencode, so the container must keep
      # the Phase 1 mark-consumed placeholder. Dispatch runs host-side
      # (.env ACP_ENABLED=true is deliberately NOT forwarded here: a .env
      # true leaking into this image would fail-close every envelope).
      - ACP_ENABLED=false
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8080
      - WEBHOOK_LOG_LEVEL=${WEBHOOK_LOG_LEVEL:-info}
        # Defaults below mirror src/webhook_receiver/config.py — keep in sync.
      - WEBHOOK_MAX_BODY_BYTES=${WEBHOOK_MAX_BODY_BYTES:-26214400}
      - WEBHOOK_EVENTS_KEEPALIVE=${WEBHOOK_EVENTS_KEEPALIVE:-15}
      - DIRECT_BODY_ALLOWED_SENDERS=${DIRECT_BODY_ALLOWED_SENDERS:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  webhook-proxy:
    # Digest pinned; same caddy:2.10.0-alpine pin as the reference repo.
    image: caddy:2.10.0-alpine  # digest sha256:ae4458638da8e1e91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c (tag→digest verified 2026-09-23; direct digest refs 404 on docker.io)
    # Cutover posture (owner decision 2026-09-23: keep the funnel
    # endpoint): host-network mode — caddy binds the host's :80 directly
    # and proxies the HOST-RUN dispatch receiver on loopback. No
    # container→host bridge hop (this host's firewall drops those), and
    # the receiver's full surface (/events) is loopback-only.
    network_mode: host
    environment:
      - WEBHOOK_SITE_ADDRESS=${WEBHOOK_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
